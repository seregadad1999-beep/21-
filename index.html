<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hamster Clicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <!-- Баланс монет -->
        <div class="balance">
            <span class="coin-icon">🪙</span>
            <span id="coinAmount">0</span>
        </div>

        <!-- Кликабельная область (хомяк) -->
        <div class="click-area" id="clickArea">
            🐹
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-item">💪 Сила клика: <span id="clickPower">1</span></div>
            <div class="stat-item">💤 Пассивный доход: <span id="passiveIncome">0</span> монет / 10 сек</div>
        </div>

        <!-- Магазин улучшений -->
        <div class="shop">
            <h2>Магазин улучшений</h2>
            
            <!-- Улучшение клика -->
            <div class="upgrade-card">
                <div class="upgrade-info">
                    <div class="upgrade-title">🔨 Улучшение клика</div>
                    <div class="upgrade-details">
                        <span>Уровень: <span id="clickLevel">0</span></span>
                        <span>➕ +1 к силе клика</span>
                    </div>
                </div>
                <div class="upgrade-action">
                    <span class="price">💰 <span id="clickPrice">10</span></span>
                    <button id="buyClickUpgrade" class="buy-btn">Купить</button>
                </div>
            </div>

            <!-- Пассивное улучшение -->
            <div class="upgrade-card">
                <div class="upgrade-info">
                    <div class="upgrade-title">🏭 Пассивный доход</div>
                    <div class="upgrade-details">
                        <span>Уровень: <span id="passiveLevel">0</span></span>
                        <span>➕ +1 монета / 10 сек</span>
                    </div>
                </div>
                <div class="upgrade-action">
                    <span class="price">💰 <span id="passivePrice">50</span></span>
                    <button id="buyPassiveUpgrade" class="buy-btn">Купить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
